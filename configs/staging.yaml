# =============================================================================
# Staging Environment Configuration
# =============================================================================
# This file contains non-sensitive configuration for the staging environment.
# Sensitive data (API keys, passwords) should be in .env file.
# =============================================================================

# =============================================================================
# Application Settings
# =============================================================================
app_name: Are You Not Entertained - Staging
environment: staging
# Hosted staging should behave like a deployed service, not expose debug details.
debug: false
random_seed: 42

# =============================================================================
# Logging Configuration
# =============================================================================
log_level: INFO
use_json_logging: true

# =============================================================================
# Database Configuration
# =============================================================================
# Settings is flat, not nested - override the DB file location with duckdb_path
# (defaults to data_dir/db/movies.duckdb if left unset).
# duckdb_path: data/db/movies.duckdb

# =============================================================================
# TMDB (The Movie Database) Configuration
# =============================================================================
tmdb_api_base_url: https://api.themoviedb.org/3

# Collection Settings
tmdb_max_movies: 5000  # Max movies per operation for staging environment

# Filtering Settings
tmdb_min_popularity: 10.0       # Minimum popularity score (0-100+)
tmdb_min_vote_count: 50         # Minimum number of votes required
tmdb_min_release_year: 2012     # Earliest year to collect
tmdb_max_release_year: null     # Latest year (null = current year)
tmdb_allowed_release_statuses:
  - Released
  - Post Production
  - In Production

# =============================================================================
# OMDB (Open Movie Database) Configuration
# =============================================================================
omdb_api_base_url: http://www.omdbapi.com

# Collection Settings
omdb_max_movies: 1000  # Max movies per operation. OMDB free tier: 1000 req/day

# Filtering Settings
omdb_min_release_year: null  # Earliest year (null = no limit)
omdb_max_release_year: null  # Latest year (null = no limit)

# =============================================================================
# The Numbers (box office) Configuration
# =============================================================================
# Maximum movies scraped in one operation. Keep this modest for HTML scraping.
numbers_max_movies: 50
# Lower this value to increase the delay between page requests. For example,
# 0.15 requests/sec is approximately 6.7 seconds between requests.
numbers_requests_per_second: 1.0

# =============================================================================
# API Rate Limiting
# =============================================================================
api_rate_limit: 40  # Requests per second across all APIs
api_timeout: 30     # Request timeout in seconds

# =============================================================================
# FastAPI Server Configuration
# =============================================================================
host: 0.0.0.0
port: 8000
reload: false
# Set exact browser origins through Azure App Settings when a separate frontend
# is deployed. Wildcard Azure hostnames are intentionally not accepted here.
cors_origins: []
