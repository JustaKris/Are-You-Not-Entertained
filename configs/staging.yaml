# =============================================================================
# Staging Environment Configuration
# =============================================================================
# This file contains non-sensitive configuration for the staging environment.
# Sensitive data (API keys, passwords) should be in .env file.
# =============================================================================

# Application Settings
app_name: Are You Not Entertained - Staging
environment: staging
debug: true

# Logging
log_level: INFO
use_json_logging: true

# API Configuration
tmdb_api_base_url: https://api.themoviedb.org/3
omdb_api_base_url: http://www.omdbapi.com
api_rate_limit: 40
api_timeout: 30

# Data Processing
random_seed: 42

# Data Collection Settings
# TMDB Collection Limits
tmdb_max_movies: 5000  # Limit for staging environment

# OMDB Collection Limits
omdb_max_movies: 1000  # OMDB has a 1000 request/day limit on free tier

# TMDB Filtering Settings
tmdb_min_popularity: 10.0
tmdb_min_vote_count: 50
tmdb_min_release_year: 2012
tmdb_max_release_year: null  # null = current year (automatic year-range splitting handles 500-page limit)
tmdb_allowed_release_statuses:
- Released
- Post Production
- In Production

# OMDB Filtering Settings
omdb_min_release_year: null  # null = no limit
omdb_max_release_year: null  # null = no limit

# FastAPI Server
host: 0.0.0.0
port: 8000
reload: false
cors_origins:
- https://staging.yourapp.com
- https://*.azurewebsites.net
