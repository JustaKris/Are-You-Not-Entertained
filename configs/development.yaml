# =============================================================================
# Development Environment Configuration
# =============================================================================
# This file contains non-sensitive configuration for the development environment.
# Sensitive data (API keys, passwords) should be in .env file.
# =============================================================================

# =============================================================================
# Application Settings
# =============================================================================
app_name: Are You Not Entertained
environment: development
debug: true
random_seed: 42

# =============================================================================
# Logging Configuration
# =============================================================================
log_level: INFO
use_json_logging: false

# =============================================================================
# Database Configuration
# =============================================================================
database:
  type: duckdb
  path: data/db/movies.duckdb
  read_only: false

# =============================================================================
# TMDB (The Movie Database) Configuration
# =============================================================================
tmdb_api_base_url: https://api.themoviedb.org/3

# Collection Settings
tmdb_max_movies: null  # null = unlimited, number = max movies per operation (collect/enrich/refresh)

# Filtering Settings
tmdb_min_popularity: 10.0       # Minimum popularity score (0-100+)
tmdb_min_vote_count: 50         # Minimum number of votes required
tmdb_min_release_year: 1950     # Earliest year to collect
tmdb_max_release_year: null     # Latest year (null = current year)
tmdb_max_movies: null
tmdb_allowed_release_statuses:
  - Released
  - Post Production
  - In Production

# =============================================================================
# OMDB (Open Movie Database) Configuration
# =============================================================================
omdb_api_base_url: http://www.omdbapi.com

# Collection Settings
omdb_max_movies: 1000  # Max movies per operation (collect/enrich/refresh). OMDB free tier: 1000 req/day

# Filtering Settings
omdb_min_release_year: 1950  # Earliest year (null = no limit)
omdb_max_release_year: 2025  # Latest year (null = no limit)

# =============================================================================
# API Rate Limiting
# =============================================================================
api_rate_limit: 40  # Requests per second across all APIs
api_timeout: 30     # Request timeout in seconds

# =============================================================================
# FastAPI Server Configuration
# =============================================================================
host: 127.0.0.1
port: 8000
reload: true
cors_origins:
  - http://localhost:3000
  - http://localhost:8000
  - http://127.0.0.1:3000
  - http://127.0.0.1:8000
