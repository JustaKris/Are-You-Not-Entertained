# =============================================================================
# Development Environment Configuration
# =============================================================================
# This file contains non-sensitive configuration for the development environment.
# Sensitive data (API keys, passwords) should be in .env file.
# =============================================================================

# Application Settings
app_name: Are You Not Entertained
environment: development
debug: true

# Logging
log_level: INFO
use_json_logging: false

# Database Configuration
database:
  type: duckdb
  path: data/db/movies.duckdb
  read_only: false

# API Configuration
tmdb_api_base_url: https://api.themoviedb.org/3
omdb_api_base_url: http://www.omdbapi.com
api_rate_limit: 40
api_timeout: 30

# Data Processing
batch_size: 100
random_seed: 42

# Data Collection Settings
# TMDB Collection Limits
tmdb_max_movies:           # null = unlimited (up to 500-page API limit ~10,000 movies)

# OMDB Collection Limits
omdb_max_movies: 1000  # OMDB has a 1000 request/day limit

# TMDB Filtering Settings
tmdb_min_popularity: 10.0
tmdb_min_vote_count: 50
tmdb_min_release_year: 1950  # Changed from 2024 to allow broader collection
tmdb_allowed_release_statuses:
- Released
- Post Production
- In Production

# FastAPI Server
host: 127.0.0.1
port: 8000
reload: true
cors_origins:
- http://localhost:3000
- http://localhost:8000
- http://127.0.0.1:3000
- http://127.0.0.1:8000
