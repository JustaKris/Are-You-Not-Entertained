# =============================================================================
# Production Environment Configuration
# =============================================================================
# This file contains non-sensitive configuration for the production environment.
# Sensitive data (API keys, passwords) should be in .env file or Azure Key Vault.
# =============================================================================

# =============================================================================
# Application Settings
# =============================================================================
app_name: Are You Not Entertained
environment: production
debug: false
random_seed: 42

# =============================================================================
# Logging Configuration
# =============================================================================
log_level: WARNING
use_json_logging: true

# =============================================================================
# Database Configuration
# =============================================================================
database:
  type: duckdb
  path: data/db/movies.duckdb
  read_only: false

# =============================================================================
# TMDB (The Movie Database) Configuration
# =============================================================================
tmdb_api_base_url: https://api.themoviedb.org/3

# Collection Settings
tmdb_max_movies: null  # null = unlimited for production

# Filtering Settings
tmdb_min_popularity: 10.0       # Minimum popularity score (0-100+)
tmdb_min_vote_count: 50         # Minimum number of votes required
tmdb_min_release_year: 2000     # Earliest year to collect
tmdb_max_release_year: null     # Latest year (null = current year)
tmdb_allowed_release_statuses:
  - Released
  - Post Production
  - In Production

# =============================================================================
# OMDB (Open Movie Database) Configuration
# =============================================================================
omdb_api_base_url: http://www.omdbapi.com

# Collection Settings
omdb_max_movies: 1000  # OMDB free tier has 1000 request/day limit

# Filtering Settings
omdb_min_release_year: null  # Earliest year (null = no limit)
omdb_max_release_year: null  # Latest year (null = no limit)

# =============================================================================
# API Rate Limiting
# =============================================================================
api_rate_limit: 40  # Requests per second across all APIs
api_timeout: 30     # Request timeout in seconds

# =============================================================================
# FastAPI Server Configuration
# =============================================================================
host: 0.0.0.0
port: 8000
reload: false
cors_origins:
  - https://yourapp.com
  - https://www.yourapp.com
  - https://*.azurewebsites.net
