name: "Security / CodeQL"

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        id: codeql_init
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          code_scanning_url="${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
          {
            echo "## $(status_icon "$job_status") CodeQL analysis"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| CodeQL initialization | $(status_icon '${{ steps.codeql_init.outcome }}') **${{ steps.codeql_init.outcome }}** |"
            echo "| CodeQL analysis | $(status_icon '${{ steps.codeql_analyze.outcome }}') **${{ steps.codeql_analyze.outcome }}** |"
            echo "| Findings | [Open code scanning results]($code_scanning_url) |"
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"
