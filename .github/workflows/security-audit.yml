name: "Security / Audit"

on:
  pull_request:
    branches: ["**"]
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Run weekly security scans on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          echo "Installing dependencies with uv..."
          uv sync --locked --no-default-groups --group security

      - name: Run bandit security scan
        id: bandit
        run: |
          echo "Running bandit security scan (code vulnerabilities)..."
          uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json

      - name: Check for known vulnerabilities
        id: pip_audit
        if: always()
        continue-on-error: true
        run: |
          echo "Checking for known vulnerabilities with pip-audit..."
          uv run pip-audit --skip-editable --format=json --output=pip-audit.json

      - name: Upload security reports
        id: upload_security_reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          report_artifact_url="${{ steps.upload_security_reports.outputs.artifact-url }}"
          {
            echo "## $(status_icon "$job_status") Security audit"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Bandit | $(status_icon '${{ steps.bandit.outcome }}') **${{ steps.bandit.outcome }}** |"
            echo "| pip-audit | $(status_icon '${{ steps.pip_audit.outcome }}') **${{ steps.pip_audit.outcome }}** (advisory) |"
            if [ -n "$report_artifact_url" ]; then
              echo "| Reports | [Download security reports]($report_artifact_url) |"
            else
              echo "| Reports | [View workflow artifacts]($run_url#artifacts) |"
            fi
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"
