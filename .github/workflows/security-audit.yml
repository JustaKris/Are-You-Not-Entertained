name: "Security / Audit"

on:
  pull_request:
    branches: ["**"]
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Run weekly security scans on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          echo "Installing dependencies with uv..."
          uv sync --locked --no-default-groups --group security

      - name: Run bandit security scan
        id: bandit
        run: |
          echo "Running bandit security scan (code vulnerabilities)..."
          uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json

      - name: Check for known vulnerabilities
        id: pip_audit
        if: always()
        continue-on-error: true
        run: |
          echo "Checking for known vulnerabilities with pip-audit..."
          uv run pip-audit --skip-editable --format=json --output=pip-audit.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Security audit"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | **${{ job.status }}** |"
            echo "| Bandit | ${{ steps.bandit.outcome }} |"
            echo "| pip-audit | ${{ steps.pip_audit.outcome }} (advisory) |"
            echo "| Reports | security-reports artifact |"
          } >> "$GITHUB_STEP_SUMMARY"
