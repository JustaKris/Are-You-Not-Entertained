name: "CI / Python"

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Run ruff linting
        id: ruff_lint
        run: uv run --no-sync ruff check src/ scripts/ tests/

      - name: Run ruff format check
        id: ruff_format
        run: uv run --no-sync ruff format --check src/ scripts/ tests/

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## $(status_icon "$job_status") Python lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Ruff lint | $(status_icon '${{ steps.ruff_lint.outcome }}') **${{ steps.ruff_lint.outcome }}** |"
            echo "| Ruff format | $(status_icon '${{ steps.ruff_format.outcome }}') **${{ steps.ruff_format.outcome }}** |"
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install type-check dependencies
        run: uv sync --locked --only-group typecheck

      - name: Run mypy
        id: mypy
        run: uv run --no-sync mypy

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## $(status_icon "$job_status") Python type check"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Mypy | $(status_icon '${{ steps.mypy.outcome }}') **${{ steps.mypy.outcome }}** |"
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests with coverage
        id: pytest
        run: |
          mkdir -p reports
          uv run --no-sync pytest --junitxml=reports/test-results.xml

      - name: Upload coverage to Codecov
        id: codecov
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./reports/coverage/coverage.xml
          flags: unittests
          name: codecov-python-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        id: upload_coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: reports/coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/test-results.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          coverage_artifact_url="${{ steps.upload_coverage.outputs.artifact-url }}"
          test_results_artifact_url="${{ steps.upload_test_results.outputs.artifact-url }}"
          {
            echo "## $(status_icon "$job_status") Python tests"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Python | ${{ matrix.python-version }} |"
            echo "| Tests | $(status_icon '${{ steps.pytest.outcome }}') **${{ steps.pytest.outcome }}** |"
            if [ "${{ matrix.python-version }}" = "3.12" ]; then
              echo "| Codecov upload | $(status_icon '${{ steps.codecov.outcome }}') **${{ steps.codecov.outcome }}** (non-blocking) |"
              echo "| Codecov report | [View coverage dashboard](https://app.codecov.io/gh/${{ github.repository }}) |"
            else
              echo "| Codecov | Not uploaded for this matrix entry |"
            fi
            if [ -n "$coverage_artifact_url" ]; then
              echo "| Coverage report | [Download artifact]($coverage_artifact_url) |"
            else
              echo "| Coverage report | [View workflow artifacts]($run_url#artifacts) |"
            fi
            if [ -n "$test_results_artifact_url" ]; then
              echo "| Test results | [Download artifact]($test_results_artifact_url) |"
            else
              echo "| Test results | [View workflow artifacts]($run_url#artifacts) |"
            fi
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"
