name: "Tests: Python"

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          echo "Installing dependencies with uv..."
          uv sync --locked --group dev

      - name: Run all tests with coverage
        id: pytest
        run: |
          mkdir -p reports
          uv run pytest --junitxml=reports/test-results.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./reports/coverage/coverage.xml
          flags: unittests
          name: codecov-umbrella-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: reports/coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/test-results.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Python tests"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | **${{ job.status }}** |"
            echo "| Python | ${{ matrix.python-version }} |"
            echo "| Tests | ${{ steps.pytest.outcome }} |"
            echo "| Coverage artifact | coverage-report-py${{ matrix.python-version }} |"
            echo "| Test results artifact | test-results-py${{ matrix.python-version }} |"
          } >> "$GITHUB_STEP_SUMMARY"
