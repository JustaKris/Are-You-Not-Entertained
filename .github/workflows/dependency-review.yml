name: "Security / Dependency Review"

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review dependency changes
        id: dependency_review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Publish job summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          review_status="${{ steps.dependency_review.outcome }}"
          dependency_graph_url="${{ github.server_url }}/${{ github.repository }}/network/dependencies"
          {
            echo "## $(status_icon "$job_status") Dependency review"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Dependency review | $(status_icon "$review_status") **$review_status** |"
            echo "| Dependency graph | [Browse repository dependencies]($dependency_graph_url) |"
          } >> "$GITHUB_STEP_SUMMARY"
