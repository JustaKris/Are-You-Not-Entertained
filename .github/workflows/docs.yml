name: "Docs / Build"

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
    paths:
      - "mkdocs.yml"
      - "docs/**/*"
      - "!docs/copilot_artifacts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install documentation dependencies
        run: |
          echo "Installing documentation dependencies with uv..."
          uv sync --locked --only-group docs

      - name: Run Markdown linting
        id: markdown_lint
        run: uv run --no-sync pymarkdown scan docs/ README.md

      - name: Build MkDocs documentation
        id: mkdocs
        run: |
          echo "Building MkDocs documentation..."
          uv run --no-sync mkdocs build --strict -d public
          echo "Documentation built successfully"
          ls -la public/

      - name: Upload artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Publish build summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          job_status="${{ job.status }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          artifact_status="${{ steps.upload_pages.outcome }}"
          {
            echo "## $(status_icon "$job_status") Documentation build"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$job_status") **$job_status** |"
            echo "| Markdown lint | $(status_icon '${{ steps.markdown_lint.outcome }}') **${{ steps.markdown_lint.outcome }}** |"
            echo "| MkDocs build | $(status_icon '${{ steps.mkdocs.outcome }}') **${{ steps.mkdocs.outcome }}** |"
            echo "| Site artifact | $(status_icon "$artifact_status") **$artifact_status** ([view workflow artifacts]($run_url#artifacts)) |"
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        if: needs.build.result == 'success'
        uses: actions/deploy-pages@v5

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Documentation deployed successfully!"
          echo "View at: ${{ steps.deployment.outputs.page_url }}"

      - name: Publish deployment summary
        if: always()
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }
          build_status="${{ needs.build.result }}"
          deployment_status="${{ steps.deployment.outcome || 'skipped' }}"
          summary_status="${{ job.status }}"
          if [ "$build_status" != "success" ] || [ "$deployment_status" = "failure" ]; then
            summary_status="failure"
          elif [ "$deployment_status" = "skipped" ]; then
            summary_status="skipped"
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          page_url="${{ steps.deployment.outputs.page_url }}"
          {
            echo "## $(status_icon "$summary_status") Documentation deployment"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | $(status_icon "$summary_status") **$summary_status** |"
            echo "| Build job | $(status_icon "$build_status") **$build_status** |"
            echo "| Deployment | $(status_icon "$deployment_status") **$deployment_status** |"
            if [ -n "$page_url" ]; then
              echo "| Live documentation | [Open published site]($page_url) |"
            else
              echo "| Live documentation | Not available because deployment did not run |"
            fi
            echo "| Run details | [View workflow run]($run_url) |"
          } >> "$GITHUB_STEP_SUMMARY"
