name: "Lint: Markdown"

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths:
      - "docs/**/*.md"
      - "*.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          echo "Installing dependencies with uv..."
          uv sync --locked --group dev

      - name: Run markdown linting
        id: markdown_lint
        continue-on-error: true
        run: |
          echo "Running markdown linting on documentation..."
          uv run pymarkdown scan docs/ README.md

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Markdown lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Job | **${{ job.status }}** |"
            echo "| Markdown lint | ${{ steps.markdown_lint.outcome }} (advisory) |"
            echo "| Guidance | [Markdown linting guide](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/development/markdown-linting.md) |"
          } >> "$GITHUB_STEP_SUMMARY"
