site_name: Are You Not Entertained (AYNE)
site_description: Movie box office analysis and prediction with modern Python practices
site_author: Kristiyan Bonev
repo_url: https://github.com/JustaKris/Are-You-Not-Entertained
repo_name: JustaKris/Are-You-Not-Entertained

theme:
  name: material
  palette:
  - scheme: default
    primary: red
    accent: amber
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: red
    accent: amber
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy

extra_css:
- stylesheets/extra.css

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          show_source: true

markdown_extensions:
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- admonition
- pymdownx.details
- pymdownx.arithmatex:
    generic: true
- attr_list
- md_in_html
- tables

nav:
- Home: index.md
- Roadmap: ROADMAP.md
- Guides:
  - CLI Guide: guides/cli-guide.md
  - Data Collection Workflow: guides/data-collection-workflow.md
  - Git Workflow: guides/git-guide.md
  - Database Monitoring: guides/database-monitoring.md
  - Pre-Commit Guide: guides/pre-commit-guide.md
  - Utilities Guide: guides/utilities-guide.md
  - VS Code:
    - Quickstart: guides/vs-code/vscode-quickstart.md
    - Configuration: guides/vs-code/vscode-configuration.md
- Development:
  - Code Quality: development/code-quality.md
  - Testing: development/testing.md
  - Security: development/security.md
  - Logging: development/logging.md
- Explanation:
  - Architecture: explanation/architecture.md
  - Technical Decisions: explanation/technical-decisions.md
- Reference:
  - TMDB API Client: reference/tmdb-client.md
  - OMDB API Client: reference/omdb-client.md
  - Database: reference/database.md
  - Refresh Strategy: reference/refresh-strategy.md
  - Data Collection Filtering: reference/data-collection-filtering.md
  - Rate Limiting: reference/rate-limiting.md
  - Data Orchestration: reference/orchestration.md

exclude_docs: |
  copilot_artifacts/
